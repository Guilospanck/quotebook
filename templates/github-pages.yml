# Builds your quotebook site and deploys it to GitHub Pages.
# One-time setup, before the first run: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Without it, configure-pages fails with "Get Pages site failed ... Not Found".
name: Deploy quotes to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/configure-pages@v6
      - name: Build site
        run: npx --yes quotebook@__VERSION__ build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: __OUT_DIR__

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
